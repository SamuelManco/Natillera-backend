spring.application.name=natillera

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&useSSL=true&trustServerCertificate=true&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}


google.client.id=${GOOGLE_CLIENT_ID}
app.cors.allowed-origins=http://localhost:5173,https://natillera-frontend.vercel.app
app.admin.role-id=${ADMIN_ROLE_ID:}