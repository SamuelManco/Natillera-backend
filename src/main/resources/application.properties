spring.application.name=natillera

# Conexion MySQL Aiven
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&useSSL=true&trustServerCertificate=true&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Configuración JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto Render
server.port=${PORT:8080}